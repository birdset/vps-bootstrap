name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-lint:
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: [24.04, 26.04]
    runs-on: ubuntu-${{ matrix.ubuntu-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n bootstrap.sh unbootstrap.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell errors
        run: shellcheck --severity=warning bootstrap.sh unbootstrap.sh
