name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n bootstrap.sh unbootstrap.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell errors
        run: shellcheck --severity=warning bootstrap.sh unbootstrap.sh
